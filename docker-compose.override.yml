# Desenvolvimento: sobe um PostgreSQL/PostGIS com o stub das tabelas do SIGA que a ferramenta lê.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: siga
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/dev:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d siga"]
      interval: 5s
      retries: 10

  migrar:
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://ocr:ocr@postgres:5432/siga
      CRIAR_VIEWS: "true"  # o banco local faz o papel do principal, com as views de acurácia

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://ocr:ocr@postgres:5432/siga
    ports: ["127.0.0.1:${API_PORTA:-8000}:8000"]  # documentação interativa em http://localhost:${API_PORTA:-8000}/docs

  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://ocr:ocr@postgres:5432/siga

  watcher:
    environment:
      DATABASE_URL: postgresql+psycopg://ocr:ocr@postgres:5432/siga
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/2
      PASTA_MONITORADA: /data/entrada

volumes:
  pgdata:
