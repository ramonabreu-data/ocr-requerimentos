# Desenvolvimento: sobe um PostgreSQL/PostGIS com o stub das tabelas do SIGA que a ferramenta lê.
# Os dados da ferramenta continuam em JSON no MinIO.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: siga
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/dev:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d siga"]
      interval: 5s
      retries: 10

  api:
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SIGA_DATABASE_URL: postgresql+psycopg://ocr:ocr@postgres:5432/siga
    ports: ["127.0.0.1:${API_PORTA:-8000}:8000"]  # documentação interativa em http://localhost:${API_PORTA:-8000}/docs

  worker:
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SIGA_DATABASE_URL: postgresql+psycopg://ocr:ocr@postgres:5432/siga

  watcher:
    environment:
      SIGA_DATABASE_URL: postgresql+psycopg://ocr:ocr@postgres:5432/siga

volumes:
  pgdata:
