# Base (produção): os dados ficam em JSON no bucket (S3/MinIO); o Redis guarda a fila e o índice.
# O banco do SIGA é só lido (SIGA_DB_* ou SIGA_DATABASE_URL no .env).
#   docker compose -f docker-compose.yml up -d
# Desenvolvimento (com Postgres/PostGIS fazendo o papel do SIGA): docker compose up  (lê também o override)
name: ocr-requerimentos

# Banco do SIGA, só leitura. SIGA_DATABASE_URL, se definida, vale sobre as partes SIGA_DB_*
# (o serviço monta a URL a partir delas; a senha não precisa ser codificada).
x-siga: &siga
  SIGA_DATABASE_URL: ${SIGA_DATABASE_URL:-}
  SIGA_DB_HOST: ${SIGA_DB_HOST:-}
  SIGA_DB_PORTA: ${SIGA_DB_PORTA:-5432}
  SIGA_DB_NOME: ${SIGA_DB_NOME:-}
  SIGA_DB_USUARIO: ${SIGA_DB_USUARIO:-}
  SIGA_DB_SENHA: ${SIGA_DB_SENHA:-}
  SIGA_DB_SSLMODE: ${SIGA_DB_SSLMODE:-prefer}

x-ocr: &ocr
  build:
    context: ./services/ocr
    args:
      COM_PADDLE: ${COM_PADDLE:-0}
  image: ocr-requerimentos/servico:${VERSAO:-latest}
  env_file: .env
  environment:
    <<: *siga
    STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    CELERY_BROKER_URL: redis://redis:6379/2
    REDIS_URL: redis://redis:6379/3
  restart: unless-stopped

services:
  # Fila e índice dos JSONs. Persistência em AOF; noeviction: com memória cheia o Redis recusa gravações
  # em vez de descartar chaves do índice. Se perder os dados, refaça o índice a partir do bucket:
  #   docker compose run --rm api python -m ocr_requerimentos.ferramentas reconstruir-indice
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ocr}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ocr-segredo-troque}
    volumes: [minio:/data]
    ports: ["127.0.0.1:9001:9001"]  # console de administração só local
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  # Cria o bucket e liga o versionamento: cada regravação de um JSON guarda a versão anterior.
  bucket:
    image: minio/minio:latest  # traz o cliente mc
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_BUCKET: ${S3_BUCKET:-ocr-requerimentos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ocr}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ocr-segredo-troque}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" && mc version enable "local/$$S3_BUCKET"
    restart: "no"

  api:
    <<: *ocr
    depends_on:
      bucket: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: ["uvicorn", "ocr_requerimentos.api.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "${API_WORKERS:-2}", "--proxy-headers"]
    expose: ["8000"]

  worker:
    <<: *ocr
    depends_on:
      bucket: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # escalar: docker compose up -d --scale worker=4
    command: ["celery", "-A", "ocr_requerimentos.worker", "worker", "-Q", "ocr,padrao",
              "--concurrency", "${WORKER_CONCORRENCIA:-2}", "--loglevel", "INFO"]
    healthcheck: { disable: true }

  watcher:
    <<: *ocr
    depends_on:
      bucket: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: ["python", "-m", "ocr_requerimentos.watcher"]
    environment:
      <<: *siga
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      CELERY_BROKER_URL: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/3
      PASTA_MONITORADA: /data/entrada
    volumes:
      - ${PASTA_SCANNER:-./entrada}:/data/entrada
    healthcheck: { disable: true }

  web:
    build: ./apps/web
    image: ocr-requerimentos/web:${VERSAO:-latest}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    ports: ["${PORTA_WEB:-3000}:3000"]

  flower:
    profiles: ["monitor"]
    image: mher/flower:2.0
    command: ["celery", "--broker=redis://redis:6379/2", "flower", "--port=5555"]
    ports: ["127.0.0.1:5555:5555"]
    depends_on: [redis]

volumes:
  redis:
  minio:
